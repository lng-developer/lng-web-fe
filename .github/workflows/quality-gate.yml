name: Quality Gate

on:
  workflow_dispatch:
    inputs:
      ui_test_file:
        description: UI test file to run by itself
        required: false
        type: string
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: ${{ inputs.ui_test_file == '' }}
    name: lint-unit-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run performance:bundle
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            dist
            server.mjs
          retention-days: 1

  ui-tests:
    if: ${{ inputs.ui_test_file == '' }}
    name: ui-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run test:ui:ci -- --shard=${{ matrix.shard }}

  ui-test-file:
    name: ui-test-file
    if: ${{ inputs.ui_test_file != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      UI_TEST_FILE: ${{ inputs.ui_test_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run test:ui:ci -- "$UI_TEST_FILE"

  deploy:
    name: deploy-server
    needs: [quality-gate, ui-tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.ui_test_file == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
      - name: Configure deployment SSH
        env:
          ECOMATRIX_SSH_PRIVATE_KEY: ${{ secrets.ECOMATRIX_SSH_PRIVATE_KEY }}
          ECOMATRIX_KNOWN_HOSTS: ${{ secrets.ECOMATRIX_KNOWN_HOSTS }}
        run: |
          test -n "$ECOMATRIX_SSH_PRIVATE_KEY"
          test -n "$ECOMATRIX_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECOMATRIX_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ECOMATRIX_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Upload build to staging release
        env:
          ECOMATRIX_HOST: ${{ secrets.ECOMATRIX_HOST }}
          ECOMATRIX_USER: ${{ secrets.ECOMATRIX_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$ECOMATRIX_HOST"
          test -n "$ECOMATRIX_USER"
          test -n "$DEPLOY_SHA"
          test -n "$DEPLOY_RUN_ID"
          tar -czf - -C dist . | ssh "$ECOMATRIX_USER@$ECOMATRIX_HOST" "set -e; staging=/srv/lng-web-fe/releases/.staging-${DEPLOY_SHA:0:12}-$DEPLOY_RUN_ID; mkdir \"\$staging\"; tar -xzf - -C \"\$staging\""

      - name: Activate build with rollback
        env:
          ECOMATRIX_HOST: ${{ secrets.ECOMATRIX_HOST }}
          ECOMATRIX_USER: ${{ secrets.ECOMATRIX_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$DEPLOY_SHA"
          test -n "$DEPLOY_RUN_ID"
          ssh "$ECOMATRIX_USER@$ECOMATRIX_HOST" "DEPLOY_SHA=$DEPLOY_SHA DEPLOY_RUN_ID=$DEPLOY_RUN_ID bash -s" <<'REMOTE'
          set -euo pipefail
          base=/srv/lng-web-fe
          current="$base/current"
          releases="$base/releases"
          release="$releases/main-${DEPLOY_SHA:0:12}"
          staging="$releases/.staging-${DEPLOY_SHA:0:12}-${DEPLOY_RUN_ID}"
          previous=$(readlink -f "$current" || true)

          cleanup() { rm -rf "$staging"; }
          trap cleanup EXIT

          if [ -d "$release" ]; then
            rm -rf "$staging"
          else
            test -f "$staging/index.html"
            mv "$staging" "$release"
          fi

          expected_hash=$(sha256sum "$release/index.html" | awk '{print $1}')
          ln -sfn "$release" "$base/current.next"
          mv -Tf "$base/current.next" "$current"

          served_hash=$(curl -ksS --fail --max-time 10 --resolve ecomatrix.lngmerch.co:443:127.0.0.1 https://ecomatrix.lngmerch.co/ | sha256sum | awk '{print $1}')
          if [ "$served_hash" != "$expected_hash" ]; then
            if [ -n "$previous" ]; then
              ln -sfn "$previous" "$base/current.next"
              mv -Tf "$base/current.next" "$current"
            fi
            exit 1
          fi

          if [ -n "$previous" ]; then
            ln -sfn "$previous" "$base/previous.next"
            mv -Tf "$base/previous.next" "$base/previous"
          fi
          trap - EXIT
          REMOTE
