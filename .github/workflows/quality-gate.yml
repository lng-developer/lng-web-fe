name: Quality Gate

on:
  workflow_dispatch:
    inputs:
      ui_test_file:
        description: UI test file to run by itself
        required: false
        type: string
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: ${{ inputs.ui_test_file == '' }}
    name: lint-unit-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run performance:bundle
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            dist
            server.mjs
          retention-days: 1

  ui-tests:
    if: ${{ inputs.ui_test_file == '' }}
    name: ui-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run test:ui:ci -- --shard=${{ matrix.shard }}

  ui-test-file:
    name: ui-test-file
    if: ${{ inputs.ui_test_file != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      UI_TEST_FILE: ${{ inputs.ui_test_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run test:ui:ci -- "$UI_TEST_FILE"

  deploy:
    name: deploy-server
    needs: [quality-gate, ui-tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && inputs.ui_test_file == '' }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
      - name: Deploy build to app directory
        run: |
          mkdir -p /home/lng/apps/lng-web-fe/dist
          rsync -a --delete dist/ /home/lng/apps/lng-web-fe/dist/
          cp server.mjs /home/lng/apps/lng-web-fe/server.mjs
      - name: Restart FE
        run: |
          pm2 restart lng-web-fe
