name: Quality Gate

on:
  workflow_dispatch:
    inputs:
      ui_test_file:
        description: UI test file to run by itself
        required: false
        type: string
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: ${{ inputs.ui_test_file == '' }}
    name: lint-unit-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run performance:bundle
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            dist
            server.mjs
          retention-days: 1

  ui-tests:
    if: ${{ inputs.ui_test_file == '' }}
    name: ui-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run test:ui:ci -- --shard=${{ matrix.shard }}

  ui-test-file:
    name: ui-test-file
    if: ${{ inputs.ui_test_file != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      UI_TEST_FILE: ${{ inputs.ui_test_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run test:ui:ci -- "$UI_TEST_FILE"

  deploy:
    name: deploy-server
    needs: [quality-gate, ui-tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && inputs.ui_test_file == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
      - name: Configure deployment SSH
        env:
          ECOMATRIX_SSH_PRIVATE_KEY: ${{ secrets.ECOMATRIX_SSH_PRIVATE_KEY }}
          ECOMATRIX_KNOWN_HOSTS: ${{ secrets.ECOMATRIX_KNOWN_HOSTS }}
        run: |
          test -n "$ECOMATRIX_SSH_PRIVATE_KEY"
          test -n "$ECOMATRIX_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECOMATRIX_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ECOMATRIX_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Deploy build to app directory
        env:
          ECOMATRIX_HOST: ${{ secrets.ECOMATRIX_HOST }}
          ECOMATRIX_USER: ${{ secrets.ECOMATRIX_USER }}
        run: |
          test -n "$ECOMATRIX_HOST"
          test -n "$ECOMATRIX_USER"
          tar -czf - -C dist . | ssh "$ECOMATRIX_USER@$ECOMATRIX_HOST" 'set -e; rm -rf /srv/lng-web-fe/dist.next; mkdir -p /srv/lng-web-fe/dist.next; tar -xzf - -C /srv/lng-web-fe/dist.next; rm -rf /srv/lng-web-fe/dist.previous; mv /srv/lng-web-fe/dist /srv/lng-web-fe/dist.previous 2>/dev/null || true; mv /srv/lng-web-fe/dist.next /srv/lng-web-fe/dist; rm -rf /srv/lng-web-fe/dist.previous'
