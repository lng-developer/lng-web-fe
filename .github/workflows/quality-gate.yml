name: Quality Gate

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: lint-unit-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  ui-tests:
    name: ui-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run test:ui -- --shard=${{ matrix.shard }}

  deploy:
    name: deploy-server
    needs: [quality-gate, ui-tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${{ secrets.FE_DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/fe_deploy_key
          chmod 600 ~/.ssh/fe_deploy_key
          ssh-keyscan -p "${{ secrets.FE_DEPLOY_PORT }}" "${{ secrets.FE_DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload dist
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/fe_deploy_key -p ${{ secrets.FE_DEPLOY_PORT }}" \
            dist/ "${{ secrets.FE_DEPLOY_USER }}@${{ secrets.FE_DEPLOY_HOST }}:/home/lng/apps/lng-web-fe/dist/"
          rsync -az -e "ssh -i ~/.ssh/fe_deploy_key -p ${{ secrets.FE_DEPLOY_PORT }}" \
            server.mjs "${{ secrets.FE_DEPLOY_USER }}@${{ secrets.FE_DEPLOY_HOST }}:/home/lng/apps/lng-web-fe/server.mjs"
      - name: Restart FE
        run: |
          ssh -i ~/.ssh/fe_deploy_key -p "${{ secrets.FE_DEPLOY_PORT }}" \
            "${{ secrets.FE_DEPLOY_USER }}@${{ secrets.FE_DEPLOY_HOST }}" \
            "pm2 restart lng-web-fe"
